<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <!-- Adapte la page aux différentes tailles d'écran -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Description de la page pour le référencement SEO -->
    <meta
        name="description"
        content="Consultez et gérez votre panier sur T-shirt Store."
    >

    <!-- Titre de la page -->
    <title>Panier | T-shirt Store</title>

    <!-- Fichier CSS principal -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome pour utiliser les icônes -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <header>

        <!-- Nom du magasin -->
        <h1>T-shirt Store</h1>

        <!-- Navigation principale -->
        <nav aria-label="Navigation principale">

            <!-- Accueil -->
            <a href="index.html" aria-label="Accueil">
                <i class="fa-solid fa-house" aria-hidden="true"></i>
            </a>

            <!-- Produits -->
            <a href="index.html#products" aria-label="Produits">
                <i class="fa-solid fa-shirt" aria-hidden="true"></i>
            </a>

            <!-- Panier : ouvre le panier sans changer de page -->
            <button
                type="button"
    id="cart-button"
    aria-label="Ouvrir le panier"
    aria-controls="cart-panel"
    aria-expanded="false"
            >
                <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
            </button>

            <!-- Contact -->
            <a href="index.html#contact" aria-label="Contact">
                <i class="fa-solid fa-envelope" aria-hidden="true"></i>
            </a>

            <!-- Connexion -->
            <a href="login.html" aria-label="Connexion">
                <i class="fa-solid fa-user" aria-hidden="true"></i>
            </a>

        </nav>

    </header>


    <!-- =========================
         PANIER
    ========================== -->

    <aside
        id="cart-panel"
        role="dialog"
        aria-labelledby="cart-title"
    >

        <!-- Fermer le panier -->
        <button
            type="button"
            id="close-cart"
            aria-label="Fermer le panier"
        >
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>

        <!-- Titre du panier -->
        <h2 id="cart-title">
            <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
            Mon panier
        </h2>

        <!-- Produits ajoutés au panier -->
        <div id="cart"></div>

    </aside>


    <!-- =========================
         CONTENU PRINCIPAL
    ========================== -->

    <main>

        <!-- Message de bienvenue -->
        <section aria-labelledby="welcome-title">

            <h2 id="welcome-title">Bienvenue</h2>

            <p>
                Bienvenue dans notre boutique de T-shirts.
            </p>

        </section>


        <!-- =========================
             SECTION DES PRODUITS
        ========================== -->

        <section
            id="products"
            aria-labelledby="products-title"
        >

            <!-- Titre de la section -->
            <h2 id="products-title">
                Nos produits
            </h2>


            <!-- Contient toutes les cartes produits -->
            <div class="products">


                <!-- =========================
                     PRODUIT 1
                ========================== -->

                <article class="pro1">

                    <!-- Nom du produit -->
                    <h3>T-shirt noir</h3>

                    <!-- Image du produit -->
                    <img
                        src="img/noir.png"
                        alt="T-shirt noir"
                    >

                    <!-- Prix -->
                    <p>15 €</p>

                    <!-- Ajouter le produit au panier -->
                    <button type="button">
                        Ajouter au panier
                    </button>

                </article>


                <!-- =========================
                     PRODUIT 2
                ========================== -->

                <article class="pro1">

                    <!-- Nom du produit -->
                    <h3>T-shirt rouge</h3>

                    <!-- Image du produit -->
                    <img
                        src="img/rouge.png"
                        alt="T-shirt rouge"
                    >

                    <!-- Prix -->
                    <p>20 €</p>

                    <!-- Ajouter le produit au panier -->
                    <button type="button">
                        Ajouter au panier
                    </button>

                </article>


                <!-- =========================
                     PRODUIT 3
                ========================== -->

                <article class="pro1">

                    <!-- Nom du produit -->
                    <h3>T-shirt blanc</h3>

                    <!-- Image du produit -->
                    <img
                        src="img/blanc.png"
                        alt="T-shirt blanc"
                    >

                    <!-- Prix -->
                    <p>25 €</p>

                    <!-- Ajouter le produit au panier -->
                    <button type="button">
                        Ajouter au panier
                    </button>

                </article>


                <!-- =========================
                     PRODUIT 4
                ========================== -->

                <article class="pro1">

                    <!-- Nom du produit -->
                    <h3>T-shirt vert</h3>

                    <!-- Image du produit -->
                    <img
                        src="img/ver.png"
                        alt="T-shirt vert"
                    >

                    <!-- Prix -->
                    <p>25 €</p>

                    <!-- Ajouter le produit au panier -->
                    <button type="button">
                        Ajouter au panier
                    </button>

                </article>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer id="contact">

        <!-- Copyright -->
        <div>
            <p>© 2026 T-shirt Store</p>
        </div>


        <!-- Informations de contact -->
        <div>

            <!-- Adresse e-mail -->
            <p>
                <a href="mailto:t-shirt@mile.com">
                    t-shirt@mile.com
                </a>
            </p>

            <!-- Numéro de téléphone -->
            <p>
                <a href="tel:+33654732113">
                    06 54 73 21 13
                </a>
            </p>

        </div>


        <!-- Retour à la section contact -->
        <div>
            <a href="#contact">
                Contact
            </a>
        </div>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <!-- Fichier JavaScript principal -->
    <script src="script.js"></script>

</body>

</html>
