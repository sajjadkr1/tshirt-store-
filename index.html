<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="T-shirt Store est une boutique en ligne proposant une sélection de T-shirts de différentes couleurs."
    >

    <title>T-shirt Store | Boutique de T-shirts</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <header>
        <h1>T-shirt Store</h1>

        <nav aria-label="Navigation principale">

            <a href="index.html" aria-label="Accueil">
                <i class="fa-solid fa-house" aria-hidden="true"></i>
            </a>

            <a href="#products" aria-label="Produits">
                <i class="fa-solid fa-shirt" aria-hidden="true"></i>
            </a>

            <a href="panier.html" aria-label="Panier">
                <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
            </a>

            <a href="#contact" aria-label="Contact">
                <i class="fa-solid fa-envelope" aria-hidden="true"></i>
            </a>

            <a href="login.html" aria-label="Connexion">
                <i class="fa-solid fa-user" aria-hidden="true"></i>
            </a>

        </nav>
    </header>


    <main>

        <section aria-labelledby="welcome-title">
            <h2 id="welcome-title">Bienvenue</h2>
            <p>Bienvenue dans notre boutique de T-shirts.</p>
        </section>


        <section id="products" aria-labelledby="products-title">

            <h2 id="products-title">Nos produits</h2>

            <div id="products-list"></div>

            <div class="products">

                <article class="pro1">
                    <h3>T-shirt noir</h3>

                    <img
                        src="img/noir.png"
                        alt="T-shirt noir"
                    >

                    <p>15 €</p>

                    <button type="button">
                        Ajouter au panier
                    </button>
                </article>


                <article class="pro1">
                    <h3>T-shirt rouge</h3>

                    <img
                        src="img/rouge.png"
                        alt="T-shirt rouge"
                    >

                    <p>20 €</p>

                    <button type="button">
                        Ajouter au panier
                    </button>
                </article>


                <article class="pro1">
                    <h3>T-shirt blanc</h3>

                    <img
                        src="img/blanc.png"
                        alt="T-shirt blanc"
                    >

                    <p>25 €</p>

                    <button type="button">
                        Ajouter au panier
                    </button>
                </article>


                <article class="pro1">
                    <h3>T-shirt vert</h3>

                    <img
                        src="img/ver.png"
                        alt="T-shirt vert"
                    >

                    <p>25 €</p>

                    <button type="button">
                        Ajouter au panier
                    </button>
                </article>

            </div>

        </section>

    </main>


    <footer id="contact">

        <div>
            <p>© 2026 T-shirt Store</p>
        </div>

        <div>
            <p>
                <a href="mailto:t-shirt@mile.com">
                    t-shirt@mile.com
                </a>
            </p>

            <p>
                <a href="tel:+33654732113">
                    06 54 73 21 13
                </a>
            </p>
        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
